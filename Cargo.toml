[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/stowage-rules/tests/fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Suppressions must use `#[expect(..., reason = "...")]`, which also fails once the lint no longer fires.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# The library reports problems as errors rather than panicking.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Adding a variant (e.g. a dependency kind) must force every match to handle it.
wildcard_enum_match_arm = "warn"

todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

let_underscore_must_use = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
guppy = "0.19.1"
thiserror = "2.0.17"
