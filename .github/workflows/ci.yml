name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps --all-features

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `pinned` is the toolchain in rust-toolchain.toml; `msrv` is the workspace rust-version.
        toolchain: [pinned, msrv]
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          if [ "${{ matrix.toolchain }}" = msrv ]; then
            msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
            rustup toolchain install "$msrv" --profile minimal
            echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
          else
            rustup toolchain install
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - run: cargo test --workspace --all-features --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  markdown:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"
