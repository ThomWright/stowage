# Checks Stowage's own dependencies. Fixture workspaces are excluded from the workspace, so they aren't checked.

[licenses]
# Every dependency must be usable from an MIT OR Apache-2.0 crate.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
